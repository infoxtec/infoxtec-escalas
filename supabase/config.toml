# Configuração do Supabase CLI. Usada pelo CI (banco vazio com todas as migrations) e na
# publicação das Edge Functions. Não altera nada nos projetos remotos por si só.
project_id = "infoxtec-escalas"

[db]
major_version = 17

# verify_jwt fixado aqui para a publicação não depender de lembrar a opção na linha de comando
[functions.documento-ocr]
verify_jwt = true

[functions.convidar-usuario]
verify_jwt = true   # chamada pelo painel com a sessão do usuário; o banco confere quem pode convidar

[functions.consulta-cadastro]
verify_jwt = true   # chamada pelo painel com a sessão do usuário; só consulta CNPJ e CEP públicos

[functions.excluir-usuario]
verify_jwt = true   # chamada pelo painel com a sessão do usuário; o banco confere quem pode excluir

[functions.alerta-email]
verify_jwt = false   # chamada só pelo banco (pg_net); protegida por token conferido no banco

[functions.voz-escala]
verify_jwt = false   # chamada pela Twilio e pelo motor; protegida por token e assinatura

[functions.espelho-pdf]
verify_jwt = false   # chamada só pelo banco (pg_net); protegida por token conferido no banco

[functions.webhook-evolution]
verify_jwt = false   # chamada pela Evolution; protegida por token conferido no banco

# Textos dos e-mails do Auth em português (decisão 123). No banco local valem daqui; na homologação e na produção,
# o mesmo conteúdo é colado em Authentication → Emails → Templates.
[auth.email.template.invite]
subject = "Seu convite para o Trilha"
content_path = "./supabase/templates/convite.html"

[auth.email.template.recovery]
subject = "Crie uma nova senha no Trilha"
content_path = "./supabase/templates/recuperacao.html"
