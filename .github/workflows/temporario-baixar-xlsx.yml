# TEMPORÁRIO (removido no mesmo PR): baixa a versão corrigida da SheetJS (xlsx 0.20.3), que só é
# distribuída pelo site oficial, e a guarda em web/vendor/, como a própria SheetJS recomenda.
# Motivo: o ambiente do Claude não alcança cdn.sheetjs.com; o GitHub Actions alcança.
name: Temporário - baixar xlsx 0.20.3

on:
  push:
    branches: [claude/dreamy-lovelace-7cxxih]
    paths: [.github/workflows/temporario-baixar-xlsx.yml]

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Baixar do site oficial
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/xlsx-0.20.3.tgz https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          ls -la web/vendor
          echo "sha512: $(openssl dgst -sha512 -binary web/vendor/xlsx-0.20.3.tgz | base64 -w0)"
          tar -tzf web/vendor/xlsx-0.20.3.tgz | head -5
          tar -xzOf web/vendor/xlsx-0.20.3.tgz package/package.json | grep '"version"'
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/vendor/xlsx-0.20.3.tgz
          git commit -m "xlsx 0.20.3 baixado do site oficial da SheetJS (cdn.sheetjs.com)"
          git push
