    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta id="titulo-app" name="apple-mobile-web-app-title" content="Trilha" />
    <script>if (location.pathname.indexOf('/ponto') === 0) { document.getElementById('manifesto').href = '/manifest-ponto.webmanifest'; document.getElementById('titulo-app').content = 'Ponto' }</script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Trilha · Escala</title>
    <link rel="icon" type="image/svg+xml" href="/trilha-icone.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
