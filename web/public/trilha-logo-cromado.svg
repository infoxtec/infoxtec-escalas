<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="Trilha. Cada passo conta.">
  <!-- Opção cromada 3D em azul: para site, apresentação e redes (não para o painel, que usa a plana). -->
  <defs>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0ff"/><stop offset=".22" stop-color="#7fb0ff"/>
      <stop offset=".48" stop-color="#1d4ed8"/><stop offset=".52" stop-color="#0b2a88"/>
      <stop offset=".78" stop-color="#3b82f6"/><stop offset="1" stop-color="#bcd6ff"/>
    </linearGradient>
    <linearGradient id="placa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/><stop offset=".45" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0a2a7a"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="esfera" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#cfe0ff"/><stop offset="1" stop-color="#6d8fd6"/>
    </radialGradient>
    <radialGradient id="esferaVerde" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#bbf7d0"/><stop offset=".5" stop-color="#22c55e"/><stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0a1f5c" flood-opacity=".45"/>
    </filter>
  </defs>
  <g transform="translate(10 12)" filter="url(#sombra)">
    <rect width="70" height="70" rx="16" fill="url(#placa)"/>
    <rect x="2" y="2" width="66" height="32" rx="14" fill="url(#brilho)"/>
    <rect width="70" height="70" rx="16" fill="none" stroke="#bcd6ff" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="16" cy="54" r="5.2" fill="url(#esfera)" opacity=".6"/>
    <circle cx="27" cy="45" r="5.2" fill="url(#esfera)" opacity=".85"/>
    <circle cx="38" cy="36" r="5.2" fill="url(#esfera)"/>
    <circle cx="52" cy="22" r="11" fill="url(#esferaVerde)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M46.8 22.2 l3.6 3.6 l6.9 -7.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#sombra)">
    <text x="96" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#cromo)" stroke="#0b2a88" stroke-width="1" textLength="150" lengthAdjust="spacingAndGlyphs">Trilha</text>
    <g fill="url(#esferaVerde)" stroke="#14532d" stroke-width=".8" aria-label="∴"><circle cx="266" cy="35" r="4.5"/><circle cx="259.5" cy="52" r="4.5"/><circle cx="272.5" cy="52" r="4.5"/></g>
  </g>
  <text x="99" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">Cada passo conta.</text>
</svg>
