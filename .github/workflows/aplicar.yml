# Aplica as migrations e publica as Edge Functions (decisão 118). Substitui os scripts aplicar-*.sh, que ficam só
# como contingência.
#   Homologação: sozinho, a cada merge na main que mexa em supabase/migrations. As Edge Functions da homologação são
#             publicadas pelo Claude (conector do Supabase): o token da conta vale para a produção também e não pode
#             ficar num ambiente sem aprovação (revisão do seguranca, P1).
#   Produção: só pelo botão (Actions → Aplicar → Run workflow, destino "producao"), e só roda depois da aprovação
#             do responsável no ambiente "producao" (Settings → Environments → Required reviewers).
# Ambientes "homologacao" e "producao", ambos restritos à branch main:
#   DB_URL                  (segredo, nos dois) conexão do banco (Session pooler, porta 5432), com a senha
#   SUPABASE_ACCESS_TOKEN   (segredo, SÓ na produção) token da conta do Supabase, para publicar Edge Functions
#   CONGELADA_ATE           (variável, só na produção, opcional) AAAA-MM-DD: recusa aplicar até essa data
#   CLOUDFLARE_API_TOKEN    (segredo, SÓ na produção) token do Cloudflare só com Workers Scripts: Edit, para o painel
#   CLOUDFLARE_ACCOUNT_ID   (opcional, variável ou segredo, só na produção) a conta do Cloudflare; sem ela, a do token
# Painel da produção (A2, decisão 133): o Worker `trilha` não faz build sozinho (Disable builds ligado no Cloudflare);
# só este workflow publica, com painel = sim, depois da aprovação no ambiente producao. Merge na main não muda o painel.
# O repositório é público: nada de dado do banco no log, só versões e nomes de função.
name: Aplicar

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/aplicar.yml'
  workflow_dispatch:
    inputs:
      destino:
        description: 'homologacao ou producao'
        required: true
        type: choice
        options: [homologacao, producao]
      ate:
        description: 'Aplicar só até esta versão (14 dígitos, inclusive). Vazio = todas as pendentes'
        required: false
        default: ''
      funcoes:
        description: 'Só na produção: Edge Functions a publicar, separadas por espaço (ex.: documento-ocr espelho-pdf). Vazio = nenhuma'
        required: false
        default: ''
      painel:
        description: 'Só na produção: publicar o painel no Worker trilha do Cloudflare (build e deploy feitos aqui, depois da aprovação)'
        required: false
        type: choice
        options: [nao, sim]
        default: nao

concurrency:
  group: aplicar-${{ github.event.inputs.destino || 'homologacao' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SUPABASE_CLI: 2.118.0

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.destino || 'homologacao' }}
    env:
      DESTINO: ${{ github.event.inputs.destino || 'homologacao' }}
      ATE: ${{ github.event.inputs.ate }}
      FUNCOES: ${{ github.event.inputs.funcoes }}
      PAINEL: ${{ github.event.inputs.painel || 'nao' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb  # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI }}

      - name: Conferências antes de aplicar
        env:
          DB_URL: ${{ secrets.DB_URL }}
          CONGELADA_ATE: ${{ vars.CONGELADA_ATE }}
          CF_TOKEN_OK: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'sim' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Só a partir da main"; exit 1; }
          [ -n "$DB_URL" ] || { echo "::error::Cadastre o segredo DB_URL no ambiente $DESTINO"; exit 1; }
          # painel = sim: confere antes de mexer no banco (o painel é o da ponta da main; com 'ate', o banco ficaria atrás dele)
          if [ "$PAINEL" = sim ]; then
            [ "$DESTINO" = producao ] || { echo "::error::painel = sim só vale na produção"; exit 1; }
            [ -z "$ATE" ] || { echo "::error::painel = sim exige 'ate' vazio"; exit 1; }
            [ -n "$CF_TOKEN_OK" ] || { echo "::error::Cadastre o segredo CLOUDFLARE_API_TOKEN no ambiente producao"; exit 1; }
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::notice::Sem CLOUDFLARE_ACCOUNT_ID: o wrangler usa a conta do token (o token tem acesso a uma conta só)"
          fi
          # o segredo precisa ser do projeto do destino (segredo trocado entre ambientes não aplica nada)
          esperado=$([ "$DESTINO" = producao ] && echo zpckrxydqqmmcrphrkxz || echo oruwnlxyvznpigbpjjbx)
          echo "::add-mask::$(echo "$DB_URL" | sed -nE 's#^[^:]+://[^:]+:([^@]+)@.*#\1#p')"
          ref=$(echo "$DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]{20}):[^@]+@[a-z0-9-]+\.pooler\.supabase\.com:5432/.*#\2#p')
          if [ "$ref" != "$esperado" ]; then
            # diagnóstico sem a senha: só sim/não de cada parte do formato
            sn() { if eval "$1"; then echo sim; else echo NÃO; fi; }
            echo "começa com postgresql://:            $(sn '[[ "$DB_URL" =~ ^postgres(ql)?:// ]]')"
            echo "usuário postgres.$esperado:  $(sn '[[ "$DB_URL" == *"://postgres.$esperado:"* ]]')"
            echo "um @ só (senha sem @ ou com %40):  $(sn '[ "$(tr -cd @ <<<"$DB_URL" | wc -c)" = 1 ]')"
            echo "servidor *.pooler.supabase.com:     $(sn '[[ "$DB_URL" =~ @[a-z0-9-]+\.pooler\.supabase\.com: ]]')"
            echo "porta 5432 (Session, não 6543):     $(sn '[[ "$DB_URL" == *.com:5432/* ]]')"
            echo "sem espaço, quebra ou colchete:     $(sn '! [[ "$DB_URL" =~ [[:space:]]|\[|\] ]]')"
            echo "::error::DB_URL do ambiente $DESTINO não é o Session pooler do projeto $esperado (veja o NÃO acima)"; exit 1
          fi
          echo "REF=$ref" >> "$GITHUB_ENV"
          if [ "$DESTINO" = producao ] && [ -n "$CONGELADA_ATE" ]; then
            if [[ "$CONGELADA_ATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -u -d "$CONGELADA_ATE" >/dev/null 2>&1; then
              if [ "$(date -u +%F)" \< "$(date -u -d "$CONGELADA_ATE + 1 day" +%F)" ]; then
                echo "::error::Produção congelada até $CONGELADA_ATE (variável CONGELADA_ATE)"; exit 1
              fi
            else
              echo "::error::CONGELADA_ATE precisa ser AAAA-MM-DD (veio '$CONGELADA_ATE')"; exit 1
            fi
          fi
          if [ -n "$ATE" ]; then
            [[ "$ATE" =~ ^[0-9]{14}$ ]] || { echo "::error::'ate' precisa ter 14 dígitos"; exit 1; }
            ls supabase/migrations/"${ATE}"_*.sql >/dev/null 2>&1 || { echo "::error::Não existe migration $ATE"; exit 1; }
            for f in supabase/migrations/*.sql; do
              v=$(basename "$f" | cut -d_ -f1)
              if [ "$v" \> "$ATE" ]; then echo "fica para depois: $(basename "$f")"; rm "$f"; fi
            done
          fi

      - name: Migrations pendentes
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: supabase migration list --db-url "$DB_URL"

      # Trava (incidente de 09/11, decisão 133): toda migration da produção precisa ter sido aplicada por este
      # workflow. O registro fica no próprio banco (supabase_migrations.aplicar_registro); na 1ª execução, o estado
      # atual vira a base. Migration que apareceu por outro caminho (integração do Supabase, SQL Editor, CLI) para a
      # produção aqui, antes de mexer em qualquer coisa. Na homologação, só avisa.
      - name: Trava, migration aplicada fora do Aplicar
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          fora=$(psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -At <<'SQL'
          create table if not exists supabase_migrations.aplicar_registro (
            version text primary key, registrado_em timestamptz not null default now(), origem text not null);
          insert into supabase_migrations.aplicar_registro (version, origem)
          select version, 'base' from supabase_migrations.schema_migrations
           where not exists (select 1 from supabase_migrations.aplicar_registro)
          on conflict do nothing;
          select string_agg(s.version, ' ' order by s.version) from supabase_migrations.schema_migrations s
           where not exists (select 1 from supabase_migrations.aplicar_registro r where r.version = s.version);
          SQL
          )
          if [ -n "$fora" ]; then
            if [ "$DESTINO" = producao ]; then
              echo "::error::Migration na produção que o Aplicar não aplicou: $fora. Algum caminho fora do Aplicar mexeu na produção (docs/caminhos-de-producao.md). O responsável investiga antes de seguir."
              exit 1
            fi
            echo "::warning::Migration na homologação aplicada fora do Aplicar: $fora (integração do Supabase da homologação ligada?)"
          fi

      - name: 'Aplicar migrations (até 3 tentativas; o Supabase às vezes responde 502)'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          for i in 1 2 3; do
            if supabase db push --db-url "$DB_URL" --yes; then exit 0; fi
            echo "tentativa $i falhou"; sleep $((i * 15))
          done
          exit 1

      - name: Registrar o que o Aplicar aplicou
        env:
          DB_URL: ${{ secrets.DB_URL }}
          RUN: ${{ github.run_id }}
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -v run="aplicar $RUN" <<'SQL'
          insert into supabase_migrations.aplicar_registro (version, origem)
          select version, :'run' from supabase_migrations.schema_migrations
          on conflict do nothing;
          SQL

      - name: plpgsql_check em todas as funções (transação desfeita, exige zero erros)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q <<'SQL'
          begin;
          create extension if not exists plpgsql_check;
          do $$
          declare r text := ''; n int := 0; f record; x record;
          begin
            for f in select p.oid, p.proname, p.prorettype = 'trigger'::regtype as trig
                     from pg_proc p join pg_namespace ns on ns.oid = p.pronamespace
                     join pg_language l on l.oid = p.prolang
                     where ns.nspname in ('public', 'interno') and l.lanname = 'plpgsql' loop
              for x in select * from plpgsql_check_function_tb(f.oid,
                         relid => case when f.trig then coalesce((select tgrelid from pg_trigger where tgfoid = f.oid limit 1), 0) else 0 end)
                       where level = 'error' loop
                n := n + 1; r := r || f.proname || ': ' || x.message || E'\n';
              end loop;
            end loop;
            if n > 0 then raise exception E'plpgsql_check: % erro(s)\n%', n, r; end if;
            raise notice 'plpgsql_check: zero erros';
          end $$;
          rollback;
          SQL

      - name: Edge Functions (só na produção; na homologação o Claude publica)
        if: env.DESTINO == 'producao' && env.FUNCOES != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [[ "$FUNCOES" =~ ^[a-z0-9-]+( [a-z0-9-]+)*$ ]] || { echo "::error::'funcoes': nomes separados por espaço"; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Cadastre o segredo SUPABASE_ACCESS_TOKEN no ambiente producao"; exit 1; }
          for f in $FUNCOES; do
            [ -d "supabase/functions/$f" ] || { echo "::error::Edge Function $f não existe"; exit 1; }
            supabase functions deploy "$f" --project-ref "$REF"
            echo "publicada: $f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Resumo
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          v=$(psql "$DB_URL" -X -At -c "select max(version) from supabase_migrations.schema_migrations")
          echo "### $DESTINO: migration $v aplicada, plpgsql_check zero" >> "$GITHUB_STEP_SUMMARY"

      # Painel da produção (A2, decisão 133): por último, depois de todo passo com segredo do banco ou do Supabase
      # (revisão do seguranca): o código das dependências do npm nunca roda antes de um passo que use o DB_URL.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: env.DESTINO == 'producao' && env.PAINEL == 'sim'
        with:
          node-version: 22

      - name: Painel, build (sem segredo; dependências sem scripts de instalação)
        if: env.DESTINO == 'producao' && env.PAINEL == 'sim'
        run: |
          cd web
          npm ci --ignore-scripts
          npm run build:producao   # aborta se o banco não for o da produção (vite.config.ts)

      - name: Painel, deploy no Worker trilha do Cloudflare
        if: env.DESTINO == 'producao' && env.PAINEL == 'sim'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd web
          npx --no-install wrangler deploy --config wrangler.producao.jsonc   # o wrangler do package-lock (integridade conferida)
          echo "publicado: painel $(node -p "require('./package.json').version") no Worker trilha (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
